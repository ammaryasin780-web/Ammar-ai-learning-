<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <title>Ammar AI</title>
  <style>
    body { font-family: Arial; background: #111; color: #fff; padding: 20px; max-width: 600px; margin: auto; }
    #chatBox { height: 400px; overflow-y: auto; border: 1px solid #444; padding: 10px; margin-bottom: 10px; border-radius: 8px; }
    input, button { padding: 10px; border-radius: 6px; border: none; }
    input { width: 75%; background: #222; color: #fff; }
    button { width: 20%; background: #0070f3; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h2>🤖 Ammar AI</h2>
  <div id="chatBox"></div>
  <input type="text" id="userInput" placeholder="Kuch poochain...">
  <button id="sendBtn">Send</button>

  <script src="script.js"></script>
</body>
</html>
