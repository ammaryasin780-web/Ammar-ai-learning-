<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ammar AI</title>
<style>
body{margin:0;background:linear-gradient(135deg,#667eea,#764ba2);font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#fff;width:95%;max-width:500px;height:85vh;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.head{background:#667eea;color:#fff;padding:18px;text-align:center;font-size:20px;font-weight:bold}
#chat{flex:1;padding:15px;overflow-y:auto;background:#f5f5f5}
.m{margin:8px 0;padding:10px 14px;border-radius:15px;max-width:80%}
.u{background:#667eea;color:#fff;margin-left:auto}
.a{background:#e0e0e0;color:#000;margin-right:auto}
.inp{display:flex;padding:12px;background:#fff;border-top:1px solid #ddd}
#msg{flex:1;padding:10px;border:2px solid #667eea;border-radius:20px;outline:none}
#btn{background:#667eea;color:#fff;border:none;padding:10px 18px;margin-left:8px;border-radius:20px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<div class="head">🤖 Ammar AI</div>
<div id="chat"><div class="m a">Salam! Main Ammar AI hun. Kuch poochein 👇</div></div>
<div class="inp">
<input id="msg" placeholder="Message likhein...">
<button id="btn" onclick="send()">Send</button>
</div>
</div>

<script>
async function send(){
let i=document.getElementById('msg');let t=i.value;if(!t)return;
add(t,'u');i.value='';
let r=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});
let d=await r.json();add(d.reply,'a');
}
function add(txt,cls){document.getElementById('chat').innerHTML+=`<div class="m ${cls}">${txt}</div>`}
document.getElementById('msg').addEventListener('keypress',e=>{if(e.key=='Enter')send()})
</script>
</body>
</html>
