<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ammar AI Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial}
.chat{background:#fff;width:95%;max-width:550px;height:90vh;border-radius:20px;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,0.3)}
.header{background:#667eea;color:#fff;padding:20px;text-align:center;font-size:22px;font-weight:bold}
.messages{flex:1;overflow-y:auto;padding:20px;background:#f8f9fa}
.msg{padding:12px 16px;margin:10px 0;border-radius:18px;max-width:80%}
.user{background:#667eea;color:#fff;margin-left:auto}
.ai{background:#e9ecef;color:#333;margin-right:auto}
.input{display:flex;padding:15px;background:#fff;border-top:1px solid #ddd}
#text{flex:1;padding:12px 18px;border:2px solid #667eea;border-radius:25px;outline:none;font-size:16px}
#send{background:#667eea;color:#fff;border:none;padding:12px 22px;margin-left:10px;border-radius:25px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<div class="chat">
<div class="header">🤖 Ammar AI</div>
<div class="messages" id="messages"><div class="msg ai">Salam! Main Ammar AI hun. Kya poochna hai? 😊</div></div>
<div class="input">
<input id="text" placeholder="Yahan likhein...">
<button id="send" onclick="send()">Send</button>
</div>
</div>
<script>
async function send(){
let input=document.getElementById('text');let msg=input.value;if(!msg)return;
add(msg,'user');input.value='';
let res=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
let data=await res.json();add(data.reply,'ai');
}
function add(t,c){document.getElementById('messages').innerHTML+=`<div class="msg ${c}">${t}</div>`}
document.getElementById('text').onkeypress=e=>{if(e.key=='Enter')send()};
</script>
</body>
</html>
