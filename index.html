<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ammar AI Learning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(180deg, #0A1F44 0%, #1A3A6E 100%); }
  .urdu { font-family: 'Noto Nastaliq Urdu', serif; }
  .hexagon { background: #FF6B00; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
  .card { transition: transform 0.2s; }
  .card:hover { transform: translateY(-5px); }
  </style>
</head>
<body class="text-white min-h-screen pb-20">

<!-- 1. LOGIN SCREEN -->
<div id="loginScreen" class="p-6 flex flex-col items-center justify-center min-h-screen">
  <h1 class="text-3xl font-bold mb-2">AmmarYasin Student Portal</h1>
  <div class="hexagon w-32 h-32 flex items-center justify-center mb-6">
    <img src="LOGO_KI_LINK_YAHAN_LAGAYEN" class="w-10 h-10 rounded-full">
  </div>
  <input id="usernameInput" type="text" placeholder="Enter Username" class="p-3 rounded-xl text-black w-80 mb-4">
  <button onclick="login()" class="bg-orange-500 px-8 py-3 rounded-xl font-bold">Login / Start Learning</button>
</div>

<!-- HEADER -->
<div id="header" class="hidden">
  <div class="hexagon w-40 h-40 mx-auto mt-6 flex-col items-center justify-center text-white">
    <img src="LOGO_KI_LINK_YAHAN_LAGAYEN" class="w-12 h-12 rounded-full mb-1">
    <h1 class="font-bold">Ammar Yasin</h1>
    <p class="urdu text-sm">عمار یاسین</p>
  </div>
  <p class="text-center mt-2">Welcome, <span id="username"></span>!</p>
</div>

<!-- LANGUAGE -->
<div id="langScreen" class="p-6 hidden">
  <h2 class="text-2xl text-center mb-6">Please Select Language</h2>
  <div class="grid grid-cols-2 gap-4">
    <button onclick="setLang('urdu')" class="card bg-orange-500 p-6 rounded-2xl font-bold urdu">اردو</button>
    <button onclick="setLang('english')" class="card bg-orange-500 p-6 rounded-2xl font-bold">English</button>
    <button onclick="setLang('hindi')" class="card bg-orange-500 p-6 rounded-2xl font-bold">हिंदी</button>
    <button onclick="setLang('italian')" class="card bg-orange-500 p-6 rounded-2xl font-bold">Italiano</button>
  </div>
</div>

<!-- CLASS -->
<div id="classScreen" class="p-6 hidden">
  <h2 class="text-2xl text-center mb-6">Select Your Class</h2>
  <div id="classGrid" class="grid grid-cols-3 gap-4"></div>
</div>

<!-- CHAT + HISTORY -->
<div id="chatScreen" class="p-4 hidden">
  <div class="flex justify-between mb-4">
    <h2 id="bookTitle" class="text-xl"></h2>
    <button onclick="showHistory()" class="bg-orange-500 px-3 py-1 rounded-lg text-sm">History</button>
  </div>
  <div id="chatBox" class="bg-white/10 p-4 rounded-2xl h-80 overflow-y-auto mb-4"></div>

  <!-- Input + Voice + Image -->
  <div class="flex gap-2">
    <input id="userInput" type="text" placeholder="Ask question..." class="flex-1 p-3 rounded-xl text-black">
    <button onclick="startVoice()" class="bg-orange-500 px-3 rounded-xl">🎤</button>
    <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="uploadImage(event)">
    <button onclick="document.getElementById('imageUpload').click()" class="bg-orange-500 px-3 rounded-xl">📷</button>
    <button onclick="sendMsg()" class="bg-orange-500 px-4 rounded-xl">Send</button>
  </div>
</div>

<!-- HISTORY SCREEN -->
<div id="historyScreen" class="p-4 hidden">
  <h2 class="text-2xl mb-4">Your History</h2>
  <div id="historyList" class="bg-white/10 p-4 rounded-2xl h-96 overflow-y-auto"></div>
  <button onclick="backToChat()" class="bg-orange-500 px-4 py-2 rounded-xl mt-4">Back</button>
</div>

<!-- FOOTER -->
<footer class="fixed bottom-0 w-full bg-[#0A1F44] p-4 text-center text-sm">
  <p>Follow Us:</p>
  <div class="flex justify-center gap-4 mt-1">
    <a href="https://instagram.com/mrammar567" class="text-orange-400">Instagram: mrammar567</a>
    <a href="https://tiktok.com/@mrammar107" class="text-orange-400">TikTok: mrammar107</a>
  </div>
  <p class="mt-2">Problem? <a href="https://whatsapp.com/channel/0029Vb8DjQs29755s7rap01G" class="text-orange-400 underline">WhatsApp Support</a></p>
</footer>

<script>
const API_KEY = "APNI_KEY_YAHAN_PASTE_KAREIN";
let currentLang = 'english';
let username = '';
let history = JSON.parse(localStorage.getItem('history_'+username)) || [];

const classes = ["Class 3","Class 4","Class 5","Class 6","Class 7","Class 8","Class 9","Class 10","Class 11","Class 12","FA","ICS","I.Com","B.A","B.Com"];

function login(){
  username = document.getElementById('usernameInput').value;
  if(username === '') { alert('Please enter username'); return; }
  history = JSON.parse(localStorage.getItem('history_'+username)) || [];
  document.getElementById('username').innerText = username;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('header').classList.remove('hidden');
  document.getElementById('langScreen').classList.remove('hidden');
}

function setLang(lang){ currentLang = lang; document.getElementById('langScreen').classList.add('hidden'); document.getElementById('classScreen').classList.remove('hidden'); loadClasses(); }
function loadClasses(){ const grid = document.getElementById('classGrid'); grid.innerHTML = ''; classes.forEach(c => { grid.innerHTML += `<button onclick="openBooks('${c}')" class="card bg-orange-500 p-4 rounded-2xl font-bold">${c}</button>`; }); }
function openBooks(cls){ document.getElementById('classScreen').classList.add('hidden'); document.getElementById('chatScreen').classList.remove('hidden'); document.getElementById('bookTitle').innerText = cls + " Books"; }

function saveHistory(q,a){ history.push({q,a}); localStorage.setItem('history_'+username, JSON.stringify(history)); }

function showHistory(){
  document.getElementById('chatScreen').classList.add('hidden');
  document.getElementById('historyScreen').classList.remove('hidden');
  let list = document.getElementById('historyList'); list.innerHTML = '';
  history.forEach(h => { list.innerHTML += `<p><b>Q:</b> ${h.q}<br><b>A:</b> ${h.a}<hr></p>`; });
}
function backToChat(){ document.getElementById('historyScreen').classList.add('hidden'); document.getElementById('chatScreen').classList.remove('hidden'); }

function startVoice(){
  let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = currentLang === 'urdu'? 'ur-PK' : 'en-US';
  recognition.start();
  recognition.onresult = e => { document.getElementById('userInput').value = e.results[0][0].transcript; }
}

function uploadImage(e){
  let file = e.target.files[0];
  document.getElementById('chatBox').innerHTML += `<p><b>You:</b> [Uploaded Image]</p>`;
  // Yahan image ko AI ko bhej sakte hain
}

async function sendMsg(){
  let msg = document.getElementById('userInput').value;
  if(msg === '') return;
  document.getElementById('chatBox').innerHTML += `<p><b>You:</b> ${msg}</p>`;

  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`, {
    method: "POST",
    body: JSON.stringify({contents:[{parts:[{text: "Reply in " + currentLang + ": " + msg}]}]})
  });
  const data = await res.json();
  let reply = data.candidates[0].content.parts[0].text;
  document.getElementById('chatBox').innerHTML += `<p class="text-orange-300"><b>AI:</b> ${reply}</p>`;
  saveHistory(msg, reply);
  document.getElementById('userInput').value = '';
}
</script>

</body>
</html>
