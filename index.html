<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ammar AI Learning</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<!-- Welcome Screen -->

<div id="welcomeScreen" class="welcome-screen">

<div class="welcome-card">

<div class="logo">🎓</div>

<h1>Welcome to Ammar AI Learning</h1>

<p>
Assalamu Alaikum 👋<br><br>
I am Ammar AI Learning. I'm here to help students and answer your questions.
</p>

<button id="startBtn" class="main-btn">
Start Learning
</button>

</div>

</div>

<!-- Setup Screen -->

<div id="setupScreen" class="setup-screen hidden">

<div class="setup-card">

<h2>Enter Your Name</h2>

<input
type="text"
id="studentName"
class="input-box"
placeholder="Enter your name">

<h2>Select Your Class</h2>

<select id="classSelect">

<option value="">Choose Class</option>

<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
<option>Class 9</option>
<option>Class 10</option>
<option>Class 11</option>
<option>Class 12</option>

</select>

<h2>Select Language</h2>

<select id="languageSelect">

<option value="Urdu">🇵🇰 Urdu</option>
<option value="Punjabi">🇵🇰 Punjabi</option>
<option value="English">🇬🇧 English</option>
<option value="Italian">🇮🇹 Italian</option>
<option value="Spanish">🇪🇸 Spanish</option>
<option value="Hindi">🇮🇳 Hindi</option>

</select>

<button id="continueBtn" class="main-btn">
Continue
</button>

</div>

</div>

<!-- Chat Screen -->

<div id="chatScreen" class="hidden">

<header>

<h2>🤖 Ammar AI Learning</h2>

</header>

<div id="chatBox"></div>

<div class="input-area">

<input
type="text"
id="userInput"
placeholder="Ask anything...">

<button id="sendBtn">
<i class="fa-solid fa-paper-plane"></i>
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
